name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d).workspace.schemes||[];console.log('ALL SCHEMES: '+s.join(', '));const pick=s.filter(x=>!/^Pods-/i.test(x)&&!/^boost$/i.test(x));if(!pick.length)process.exit(2);console.log(pick[0]);})" \
            | tail -n 1)
          if [ -z "$SCHEME" ]; then echo "failed to resolve app scheme"; exit 1; fi
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "no .app produced, listing products:"
            find ios/build/Build/Products -maxdepth 3 -type d | head -n 50
            exit 1
          fi
          echo "app=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ChromaShot-unsigned.ipa Payload
          ls -lh ChromaShot-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ChromaShot-unsigned-ipa
          path: ChromaShot-unsigned.ipa
          retention-days: 14
