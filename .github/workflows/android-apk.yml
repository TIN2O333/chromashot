name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "no apk produced, listing outputs:"
            find android/app/build/outputs -maxdepth 4 -type f | head -n 50
            exit 1
          fi
          echo "apk=$APK_PATH"
          cp "$APK_PATH" ChromaShot.apk
          ls -lh ChromaShot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChromaShot-apk
          path: ChromaShot.apk
          retention-days: 14
